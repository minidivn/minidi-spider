[package]
name = "minidi-spider"
version = "0.1.0"
edition = "2021"
description = "WikiData crawler that builds a HyperGraph index for semantic search"

[dependencies]
# HTTP & Networking
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }

# Data structures
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"                # embedded database for graph storage
bincode = "1"               # binary serialization for sled

# Async
async-trait = "0.1"

# CLI & config
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
anyhow = "1"
thiserror = "1"

# Text processing & search
tantivy = "0.22"            # full-text search engine
unicode-normalization = "0.1"
unicode-segmentation = "1"
regex-lite = "0.1"          # lightweight regex

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"          # progress bars

# Vietnam-specific: date/time parsing
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
