name: Incremental Data Fill

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Specific partition to crawl (e.g. adm-hanoi). Empty = use cursor.'
        required: false
        default: ''
      force:
        description: 'Force re-crawl even if partition already completed'
        required: false
        type: boolean
        default: false

  schedule:
    # Daily at 04:00 UTC — processes one partition per run
    - cron: '0 4 * * *'

env:
  # Target data repo (exported data lives here)
  DATA_REPO: minidivn/minidi-vn-data
  DATA_BRANCH: main
  # Where docs/ lives in the data repo
  DATA_DOCS_PATH: docs
  RUST_LOG: info

jobs:
  incremental-crawl:
    runs-on: ubuntu-latest
    # Requires a PAT with repo scope stored as DATA_REPO_TOKEN secret
    # Create at: https://github.com/settings/tokens → repo scope
    # Add to minidi-spider repo: Settings → Secrets → Actions → DATA_REPO_TOKEN
    if: ${{ secrets.DATA_REPO_TOKEN != '' }}

    steps:
      - name: Checkout minidi-spider (tool source)
        uses: actions/checkout@v4
        with:
          path: tool

      - name: Checkout minidi-vn-data (data repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tool/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tool/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build minidi-spider
        working-directory: tool
        run: cargo build --release
        timeout-minutes: 20

      - name: Determine partition to crawl
        id: partition
        working-directory: data
        run: |
          CURSOR_FILE="_data/cursor.json"
          PARTITION="${{ inputs.partition }}"

          if [ -z "$PARTITION" ]; then
            if [ -f "$CURSOR_FILE" ]; then
              # Read from cursor
              PARTITION=$(python3 -c "
import json
with open('$CURSOR_FILE') as f:
    c = json.load(f)
print(c.get('current_partition', ''))
")
            fi
          fi

          if [ -z "$PARTITION" ]; then
            # Start with first partition
            cd ../tool
            PARTITION=$(cargo run --release -- crawl --list-partitions 2>/dev/null | \
              grep -E '^\s+adm' | head -1 | awk '{print $1}' || echo "adm-vn-country")
          fi

          echo "partition=$PARTITION" >> $GITHUB_OUTPUT
          echo "Next partition: $PARTITION"

      - name: Crawl partition
        working-directory: tool
        run: |
          cargo run --release -- crawl \
            --partition ${{ steps.partition.outputs.partition }} \
            --progress \
            --db /tmp/spider.db
        timeout-minutes: 30

      - name: Export to JSON
        working-directory: tool
        run: |
          mkdir -p /tmp/export
          cargo run --release -- export \
            --db /tmp/spider.db \
            --output /tmp/export
        timeout-minutes: 10

      - name: Merge new data into data repo
        working-directory: data
        run: |
          # Ensure docs/ exists
          mkdir -p docs _data

          # Copy export into data repo docs/
          PARTITION="${{ steps.partition.outputs.partition }}"

          # Merge index.json (combine existing + new)
          python3 << 'PYEOF'
          import json, os, sys

          export_file = "/tmp/export/index.json"
          data_file = "docs/index.json"
          data_lite_file = "docs/index.lite.json"
          partition = "${{ steps.partition.outputs.partition }}"

          # Load fresh export
          with open(export_file) as f:
            fresh = json.load(f)

          # Load existing index in data repo (if any)
          existing = {"meta": {"entity_count": 0, "edge_count": 0}, "nodes": [], "edges": []}
          if os.path.exists(data_file):
            with open(data_file) as f:
              existing = json.load(f)

          # Merge nodes (deduplicate by id)
          seen = {n["id"] for n in existing["nodes"]}
          for n in fresh["nodes"]:
            if n["id"] not in seen:
              existing["nodes"].append(n)
              seen.add(n["id"])

          # Merge edges (deduplicate by source+relation+target)
          seen_edges = {f'{e["s"]}|{e["r"]}|{e["t"]}' for e in existing["edges"]}
          for e in fresh["edges"]:
            key = f'{e["s"]}|{e["r"]}|{e["t"]}'
            if key not in seen_edges:
              existing["edges"].append(e)
              seen_edges.add(key)

          # Update counts
          existing["meta"]["entity_count"] = len(existing["nodes"])
          existing["meta"]["edge_count"] = len(existing["edges"])
          existing["meta"]["last_partition"] = partition
          existing["meta"]["updated_at"] = fresh["meta"]["crawled_at"]

          # Write merged index
          with open(data_file, 'w') as f:
            json.dump(existing, f)

          # Write lite index
          lite = [{"id": n["id"], "l": n["l"], "lv": n.get("lv"), "t": n["t"], "u": n["u"]}
                  for n in existing["nodes"]]
          with open(data_lite_file, 'w') as f:
            json.dump(lite, f)

          print(f"Merged: {len(fresh['nodes'])} new nodes → {existing['meta']['entity_count']} total")
          print(f"        {len(fresh['edges'])} new edges → {existing['meta']['edge_count']} total")
          PYEOF

      - name: Copy partitioned exports
        working-directory: data
        run: |
          # Copy partition files if they exist
          for dir in entities timeline relations; do
            if [ -d "/tmp/export/v1/$dir" ]; then
              mkdir -p "docs/v1/$dir"
              cp -r "/tmp/export/v1/$dir/"* "docs/v1/$dir/"
            fi
          done
          # Copy embeddings
          cp /tmp/export/embeddings.* docs/ 2>/dev/null || true
          cp /tmp/export/sources.json docs/ 2>/dev/null || true

      - name: Update cursor
        working-directory: data
        run: |
          CURRENT="${{ steps.partition.outputs.partition }}"

          # Get next partition
          cd ../tool
          NEXT=$(cargo run --release -- crawl --list-partitions 2>/dev/null | \
            awk -v cur="$CURRENT" '{
              if (found) { print $1; found=0; exit }
              if ($1 == cur) found=1
            }' || echo "")

          cd ../data

          # Read or create cursor
          CURSOR_FILE="_data/cursor.json"
          COMPLETED='[]'
          REMAINING='[]'

          if [ -f "$CURSOR_FILE" ]; then
            COMPLETED=$(python3 -c "import json; print(json.dumps(json.load(open('$CURSOR_FILE')).get('completed', [])))")
            REMAINING=$(python3 -c "import json; print(json.dumps(json.load(open('$CURSOR_FILE')).get('remaining', [])))")
          fi

          # Add current to completed, remove from remaining
          python3 << PYEOF
          import json, os
          cursor_file = "$CURSOR_FILE"
          current = "$CURRENT"
          next_part = "$NEXT"

          completed = json.loads('$COMPLETED')
          remaining = json.loads('$REMAINING')

          if current not in completed:
            completed.append(current)
          if current in remaining:
            remaining.remove(current)

          cursor = {
              "current_partition": next_part if next_part else "",
              "completed": completed,
              "remaining": remaining,
              "total": 50,
              "progress": f"{len(completed)}/50",
              "updated_at": os.popen('date -u +%Y-%m-%dT%H:%M:%SZ').read().strip()
          }

          with open(cursor_file, 'w') as f:
              json.dump(cursor, f, indent=2)

          print(f"Progress: {len(completed)}/50 — next: {next_part or 'DONE'}")
          PYEOF

          # Store completion flag
          if [ -z "$NEXT" ]; then
            echo "all_done=true" >> $GITHUB_OUTPUT
          else
            echo "all_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        working-directory: data
        run: |
          PARTITION="${{ steps.partition.outputs.partition }}"
          git config user.name "minidi-spider[bot]"
          git config user.email "minidi-spider[bot]@users.noreply.github.com"

          git add docs/ _data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['entity_count'])")
            EDGES=$(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['edge_count'])")
            CURSOR=$(python3 -c "import json; c=json.load(open('_data/cursor.json')); print(c.get('progress','?'))")

            git commit -m "feat(data): add $PARTITION

            - ${COUNT} total entities, ${EDGES} total edges
            - Cursor progress: ${CURSOR}
            - Source: WikiData SPARQL"

            git push origin $DATA_BRANCH
            echo "Committed and pushed"
          fi

      - name: Create PR on completion (all 50 partitions done)
        if: steps.cursor.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        working-directory: data
        run: |
          gh pr create \
            --repo ${{ env.DATA_REPO }} \
            --base main \
            --head main \
            --title "chore(data): initial data fill complete" \
            --body "All 50 partitions have been crawled and merged.

            ## Stats
            - Entities: $(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['entity_count'])")
            - Edges: $(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['edge_count'])")

            This PR tags the completion of the initial data fill. Ready for review and Pages deployment."
