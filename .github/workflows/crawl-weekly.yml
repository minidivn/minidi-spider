name: Weekly WikiData Crawl (Default Country)

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code (default from countries.json)'
        required: false
        default: ''
      limit:
        description: 'Max entities per dataset (0 = no limit)'
        required: false
        default: '0'

env:
  CARGO_TERM_COLORS: always
  RUST_LOG: info

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build minidi-spider (release)
        run: cargo build --release
        timeout-minutes: 15

      - name: Run crawl
        id: crawl
        run: |
          mkdir -p data
          COUNTRY="${{ inputs.country }}"

          if [ -n "$COUNTRY" ]; then
            FLAG="--country ${COUNTRY}"
            echo "country_code=${COUNTRY}" >> $GITHUB_OUTPUT
          else
            # Read default from countries.json
            COUNTRY=$(python3 -c "import json; print(json.load(open('countries.json'))['default_country'])")
            FLAG="--country ${COUNTRY}"
            echo "country_code=${COUNTRY}" >> $GITHUB_OUTPUT
          fi

          echo "🌍 Crawling for country: ${COUNTRY}"
          cargo run --release -- crawl \
            --db data/spider.db \
            --progress \
            ${FLAG} \
            ${{ inputs.limit != '' && inputs.limit != '0' && format('--limit {0}', inputs.limit) || '' }}
        timeout-minutes: 30

      - name: Export to output directory
        run: |
          COUNTRY="${{ steps.crawl.outputs.country_code }}"
          OUTPUT_DIR="docs"

          cargo run --release -- export \
            --country "${COUNTRY}" \
            --db data/spider.db \
            --output "${OUTPUT_DIR}" \
            --embeddings
        timeout-minutes: 10

      - name: Generate crawl report
        run: |
          mkdir -p docs/_metadata
          COUNTRY="${{ steps.crawl.outputs.country_code }}"

          ENTITIES=$(python3 -c "import json; d=json.load(open('docs/_data/index.json')); print(d['meta']['entity_count'])")
          EDGES=$(python3 -c "import json; d=json.load(open('docs/_data/index.json')); print(d['meta']['edge_count'])")

          cat > docs/_metadata/crawl-report-latest.json << EOF
          {
            "crawl_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}",
            "country": "${COUNTRY}",
            "entity_count": $ENTITIES,
            "edge_count": $EDGES,
            "status": "success"
          }
          EOF

      - name: Regenerate provenance
        run: |
          COUNTRY="${{ steps.crawl.outputs.country_code }}"
          COUNTRY_NAME=$(python3 -c "
import json
with open('countries.json') as f:
    cfg = json.load(f)
for c in cfg['countries']:
    if c['code'] == '${COUNTRY}':
        print(c['name'])
        break
" 2>/dev/null || echo "${COUNTRY}")

          cat > docs/_metadata/provenance.json << EOF
          {
            "generated_by": "minidi-spider",
            "source": "https://query.wikidata.org/sparql",
            "country": "${COUNTRY}",
            "country_name": "${COUNTRY_NAME}",
            "queries": [
              "wikidata.rs:QUERY_PLACES",
              "wikidata.rs:QUERY_PEOPLE",
              "wikidata.rs:QUERY_EVENTS"
            ],
            "crawl_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit and create PR
        run: |
          git config user.name "minidi-spider[bot]"
          git config user.email "minidi-spider[bot]@users.noreply.github.com"

          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): weekly crawl $(date -u +%Y-%m-%d)"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: commit

      - name: Create/update PR into main
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(gh pr list --head $(git rev-parse --abbrev-ref HEAD) --base main --json number --jq '.[0].number' 2>/dev/null || echo "")
          COUNTRY="${{ steps.crawl.outputs.country_code }}"

          if [ -z "$PR_NUM" ]; then
            gh pr create \
              --base main \
              --head $(git rev-parse --abbrev-ref HEAD) \
              --title "chore(data): weekly data refresh $(date -u +%Y-%m-%d)" \
              --body "**Automated weekly crawl for ${COUNTRY}.** See _metadata/crawl-report-latest.json for stats."
          else
            gh pr edit $PR_NUM \
              --title "chore(data): weekly data refresh $(date -u +%Y-%m-%d)"
          fi
