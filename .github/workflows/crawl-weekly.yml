name: Weekly WikiData Crawl

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max entities per dataset (0 = no limit)'
        required: false
        default: '0'
      skip_edges:
        description: 'Skip edge fetching (faster)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLORS: always
  RUST_LOG: info

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build minidi-spider (release)
        run: cargo build --release
        timeout-minutes: 15

      - name: Run crawl
        run: |
          mkdir -p data
          cargo run --release -- crawl --db data/spider.db --progress \
            ${{ inputs.limit != '' && inputs.limit != '0' && format('--limit {0}', inputs.limit) || '' }}
        timeout-minutes: 30

      - name: Export to docs/
        run: |
          cargo run --release -- export --db data/spider.db --output docs --embeddings
        timeout-minutes: 10

      - name: Generate crawl report
        run: |
          mkdir -p docs/_metadata
          ENTITIES=$(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['entity_count'])")
          EDGES=$(python3 -c "import json; d=json.load(open('docs/index.json')); print(d['meta']['edge_count'])")

          cat > docs/_metadata/crawl-report-latest.json << EOF
          {
            "crawl_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}",
            "entity_count": $ENTITIES,
            "edge_count": $EDGES,
            "binary_version": "$(cargo run --release -- --version 2>/dev/null || echo 'unknown')",
            "status": "success"
          }
          EOF

      - name: Regenerate provenance
        run: |
          cat > docs/_metadata/provenance.json << EOF
          {
            "generated_by": "minidi-spider",
            "source": "https://query.wikidata.org/sparql",
            "queries": [
              "crawler/sparql.rs:VIETNAM_ADMIN_DIVISIONS",
              "crawler/sparql.rs:VIETNAM_HISTORY_EVENTS",
              "crawler/sparql.rs:VIETNAM_PEOPLE",
              "crawler/sparql.rs:VIETNAM_HERITAGE"
            ],
            "crawl_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit to develop
        run: |
          git config user.name "minidi-spider[bot]"
          git config user.email "minidi-spider[bot]@users.noreply.github.com"

          # Only commit if docs/ changed
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): weekly crawl $(date -u +%Y-%m-%d)

            Auto-committed by minidi-spider crawl-weekly workflow"
            git push origin develop
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: commit

      - name: Create/update PR into main
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if PR already exists
          PR_NUM=$(gh pr list --head develop --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUM" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "chore(data): weekly data refresh $(date -u +%Y-%m-%d)" \
              --body "**Automated weekly crawl.** See _metadata/crawl-report-latest.json for stats.

            - Source: WikiData SPARQL (Vietnam entities)
            - Generated by minidi-spider crawl-weekly workflow
            - Review & merge to publish to GitHub Pages

            > ⚠️ This is an automated PR. Validate docs/index.json structure before merging."
          else
            gh pr edit $PR_NUM \
              --title "chore(data): weekly data refresh $(date -u +%Y-%m-%d)" \
              --body "Updated crawl. Previous PR body applies."
          fi
